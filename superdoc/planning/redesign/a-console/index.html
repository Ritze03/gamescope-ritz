<title>Console Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Direction A — "CONSOLE"
   One full-bleed pane. No floating windows. Rail (master) + Stage (detail),
   depth by drilling in. Everything below derives from two variables:
     --u   the spacing unit  (4px @ display_scale 1.0)
     --fs  the type base     (15px @ display_scale 1.0)
   Change those two and the whole console scales. That is the point.
   ========================================================================== */

:root{
  /* --- scale ------------------------------------------------------------ */
  --u: 4px;
  --fs: 15px;

  /* --- accent family (OKLCH, hue is the only user-tunable axis) ---------- */
  --hue: 218;
  --accent:        oklch(.74 .12 var(--hue));
  --accent-edge:   oklch(.80 .12 var(--hue));
  --accent-value:  oklch(.84 .10 var(--hue));
  --accent-text:   oklch(.82 .10 var(--hue));
  --accent-knob:   oklch(.86 .08 var(--hue));
  --accent-seg:    oklch(.90 .07 var(--hue));
  --accent-a08:    oklch(.74 .12 var(--hue) / .08);
  --accent-a12:    oklch(.74 .12 var(--hue) / .12);
  --accent-a18:    oklch(.74 .12 var(--hue) / .18);
  --accent-a30:    oklch(.74 .12 var(--hue) / .30);
  --accent-a55:    oklch(.74 .12 var(--hue) / .55);

  /* --- semantic state --------------------------------------------------- */
  --ok:     oklch(.78 .16 145);
  --warn:   oklch(.72 .17 55);
  --danger: oklch(.70 .17 25);

  /* --- surfaces (elevation = white alpha over the blurred base) ---------- */
  --surface:  rgba(8,9,11,.86);
  --e1: rgba(255,255,255,.030);   /* rail, well, toolbar          */
  --e2: rgba(255,255,255,.060);   /* focused row                  */
  --e3: rgba(255,255,255,.100);   /* sheet                        */
  --hair:        rgba(255,255,255,.085);
  --hair-strong: rgba(255,255,255,.16);

  /* --- text roles ------------------------------------------------------- */
  --t-primary:  rgba(239,245,251,.93);
  --t-label:    rgba(239,245,251,.68);
  --t-meta:     rgba(239,245,251,.46);
  --t-disabled: rgba(239,245,251,.30);

  /* --- derived metrics (never hand-typed anywhere below) ---------------- */
  --row-h:    calc(var(--u) * 11);   /* 44px  */
  --pad-x:    calc(var(--u) * 6);    /* 24px  */
  --rail-w:   calc(var(--u) * 62);   /* 248px */
  --ctl-w:    calc(var(--u) * 56);   /* 224px */
  --con-w:    calc(var(--u) * 297);  /* 1188  */
  --con-h:    calc(var(--u) * 192);  /* 768   */
  --radius:   calc(var(--u) * 1.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* Committed single-theme design: this is a game overlay, composited over a
   running game at night. A light variant would be a flashbang. The ground is
   painted explicitly so the page never borrows the host's. */
body{
  font-family:'Geist',system-ui,sans-serif;
  background:#05070a;color:var(--t-primary);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- the game behind the overlay ---------------------------------- */
#game{position:fixed;inset:0;z-index:0;transition:opacity .3s}
#game .art{position:absolute;inset:0}
#game.g0 .art{background:
  radial-gradient(120% 90% at 22% 18%, #2c5c7a 0%, #12222f 42%, #070b10 100%),
  linear-gradient(140deg,#3d2a12 0%, transparent 55%);}
#game.g1 .art{background:
  radial-gradient(90% 70% at 70% 30%, #d9762a 0%, #6c2a12 35%, #170c08 100%),
  repeating-linear-gradient(112deg, rgba(255,255,255,.05) 0 3px, transparent 3px 22px);}
#game.g2 .art{background:
  radial-gradient(120% 120% at 50% 110%, #e8eef5 0%, #9fb4c6 30%, #3f5568 65%, #16202b 100%);}
/* compositor's own blur + darkening pass, approximated */
#scrim{position:fixed;inset:0;z-index:1;backdrop-filter:blur(26px) saturate(1.08);
  background:rgba(4,6,9,.62);}

/* ---------- demo strip (NOT part of the design — it explains the mock) ----- */
#demo{position:fixed;left:0;right:0;top:0;height:52px;z-index:60;
  display:flex;gap:14px;align-items:center;flex-wrap:nowrap;overflow-x:auto;
  padding:0 16px;background:#05070a;border-bottom:1px solid rgba(255,255,255,.10);
  font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.02em;
  color:rgba(255,255,255,.62)}
#demo .who{display:flex;flex-direction:column;gap:1px;flex:none;padding-right:4px}
#demo .who strong{font-family:'Geist',sans-serif;font-size:12.5px;font-weight:600;
  color:rgba(255,255,255,.92);letter-spacing:0}
#demo .who span{font-size:10px;color:rgba(255,255,255,.38)}
#demo b{color:rgba(255,255,255,.40);font-weight:500;text-transform:uppercase;flex:none}
#demo button{font:inherit;background:rgba(255,255,255,.06);color:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:5px 9px;cursor:pointer;flex:none}
#demo button:hover{background:rgba(255,255,255,.11)}
#demo button.on{background:var(--accent-a30);border-color:var(--accent-a55);color:#fff}
#demo input[type=range]{width:88px;accent-color:oklch(.74 .12 var(--hue));flex:none}
#demo .sep{width:1px;height:22px;background:rgba(255,255,255,.12);flex:none}
#demo .keys{margin-left:auto;display:flex;gap:12px;align-items:center;flex:none;
  color:rgba(255,255,255,.42);padding-left:12px}
#demo .keys kbd{font:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:3px;padding:2px 5px;color:rgba(255,255,255,.75)}

/* ==========================================================================
   THE CONSOLE
   ========================================================================== */
#wrap{position:fixed;inset:52px 0 0 0;z-index:10;display:grid;place-items:center;padding:12px}
.console{
  width:min(var(--con-w), 100%);
  height:min(var(--con-h), 100%);
  background:var(--surface);
  backdrop-filter:blur(22px) saturate(1.1);
  border:1px solid var(--hair);
  border-radius:var(--radius);
  display:grid;
  grid-template-rows:auto 1fr auto;
  overflow:hidden;
  box-shadow:0 40px 120px -30px rgba(0,0,0,.9);
  position:relative;
}

/* ---------- header rail --------------------------------------------------- */
.hdr{
  height:calc(var(--u)*14);
  display:flex;align-items:center;gap:calc(var(--u)*3);
  padding:0 var(--pad-x);
  border-bottom:1px solid var(--hair);
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.008));
}
.brand{width:calc(var(--u)*2.5);height:calc(var(--u)*2.5);background:var(--accent);
  box-shadow:0 0 calc(var(--u)*3) var(--accent-a55);flex:none}
.crumb{display:flex;align-items:center;gap:calc(var(--u)*2);
  font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.78);font-weight:600;
  text-transform:uppercase;color:var(--t-primary)}
.crumb .sep{color:var(--t-disabled);font-weight:400}
.crumb .up{color:var(--t-meta)}
.pips{display:flex;gap:calc(var(--u)*.75);margin-left:calc(var(--u)*1)}
.pips i{width:calc(var(--u)*1.5);height:calc(var(--u)*.75);background:rgba(255,255,255,.16);display:block}
.pips i.on{background:var(--accent)}
.hdr .spacer{flex:1}
.badge{font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.7);text-transform:uppercase;
  padding:calc(var(--u)*.75) calc(var(--u)*1.5);background:var(--accent-a18);color:var(--accent-text)}
.live{display:flex;gap:calc(var(--u)*3);font-family:'Geist Mono',monospace;
  font-size:calc(var(--fs)*.72);color:var(--t-meta)}
.live b{color:var(--accent-value);font-weight:500}

/* ---------- body: rail + stage -------------------------------------------- */
.body{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:0}
.body.wide{grid-template-columns:calc(var(--u)*16) 1fr}

.rail{
  border-right:1px solid var(--hair);background:var(--e1);
  padding:calc(var(--u)*3) 0;display:flex;flex-direction:column;min-height:0;
  transition:none;
}
.rail .rgroup{font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.68);
  text-transform:uppercase;color:var(--t-disabled);
  padding:calc(var(--u)*3) var(--pad-x) calc(var(--u)*1.5)}
.body.wide .rail .rgroup{display:none}
.ri{
  position:relative;display:flex;align-items:center;gap:calc(var(--u)*3);
  height:calc(var(--u)*12);padding:0 var(--pad-x);cursor:pointer;
  color:var(--t-label);font-size:calc(var(--fs)*.95);
}
.ri .gl{width:calc(var(--u)*4.5);height:calc(var(--u)*4.5);flex:none;position:relative}
.ri:hover{background:rgba(255,255,255,.04)}
.ri.sel{background:var(--accent-a12);color:var(--t-primary)}
.ri.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--u)*.75);background:var(--accent)}
.ri.foc{background:var(--e2)}
.ri.foc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--u)*.75);background:var(--accent);
  box-shadow:0 0 calc(var(--u)*3) var(--accent-a55)}
.ri .cnt{margin-left:auto;font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.72);color:var(--t-disabled)}
.body.wide .ri{justify-content:center;padding:0;gap:0}
.body.wide .ri .lbl,.body.wide .ri .cnt{display:none}
.rail .grow{flex:1}
.rail .foot{padding:calc(var(--u)*2) var(--pad-x);border-top:1px solid var(--hair);
  font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.68);color:var(--t-disabled)}
.body.wide .rail .foot{display:none}

/* glyphs — flat, 1.5px strokes, same family as data/icons */
.gl svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:square;opacity:.8}
.ri.sel .gl svg,.ri.foc .gl svg{stroke:var(--accent-knob);opacity:1}

/* ---------- stage --------------------------------------------------------- */
.stage{display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.subtabs{display:flex;gap:calc(var(--u)*.75);padding:calc(var(--u)*3) var(--pad-x) 0}
.subtabs button{
  font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.76);font-weight:500;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:rgba(239,245,251,.5);padding:calc(var(--u)*1.75) calc(var(--u)*3.5);cursor:pointer;
}
.subtabs button.on{background:var(--accent-a30);border-color:var(--accent-a55);
  color:var(--accent-seg);font-weight:600}
.subtabs .rt{margin-left:auto;display:flex;align-items:center;gap:calc(var(--u)*2);
  font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.7);color:var(--t-disabled)}

.scroll{flex:1;min-height:0;overflow:auto;padding:0 var(--pad-x) calc(var(--u)*5)}
.scroll::-webkit-scrollbar{width:calc(var(--u)*1.5)}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14)}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- WELL (replaces "the other panel") ------------------------------ */
.well{margin:calc(var(--u)*3) var(--pad-x) 0;background:var(--e1);
  border:1px solid var(--hair);position:relative;overflow:hidden}
.well .wh{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*2) calc(var(--u)*3);
  border-bottom:1px solid var(--hair);
  font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.68);text-transform:uppercase;color:var(--t-meta)}
.well .wh .dot{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);background:var(--accent);
  box-shadow:0 0 calc(var(--u)*2.5) var(--accent-a55)}
.well .wh .r{margin-left:auto;color:var(--t-disabled);text-transform:none}

/* live HUD preview: a cut-out of the game with the real HUD drawn at real scale */
.preview{position:relative;height:calc(var(--u)*40);
  background:
    radial-gradient(120% 90% at 22% 18%, #2c5c7a 0%, #12222f 42%, #070b10 100%);
  background-size:cover}
.preview.g1{background:radial-gradient(90% 70% at 70% 30%, #d9762a 0%, #6c2a12 35%, #170c08 100%)}
.preview.g2{background:radial-gradient(120% 120% at 50% 110%, #e8eef5 0%, #9fb4c6 30%, #3f5568 65%, #16202b 100%)}
.pgrid{position:absolute;inset:calc(var(--u)*2);display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--u)*1)}
.pcell{border:1px dashed rgba(255,255,255,.14);cursor:pointer;position:relative}
.pcell:hover{background:rgba(255,255,255,.06)}
.pcell.sel{border:1px solid var(--accent-a55);background:var(--accent-a12)}
.hud{position:absolute;pointer-events:none;background:rgba(9,11,14,.6);
  border:1px solid rgba(255,255,255,.12);padding:calc(var(--u)*2) calc(var(--u)*2.75);
  font-family:'Geist Mono',monospace;line-height:1.15;min-width:calc(var(--u)*38)}
.hud .r1{display:flex;align-items:baseline;gap:calc(var(--u)*1.5)}
.hud .n{font-size:calc(var(--fs)*1.2);font-weight:600;color:#fff}
.hud .u2{font-size:calc(var(--fs)*.66);color:rgba(255,255,255,.5)}
.hud .ms{margin-left:auto;font-size:calc(var(--fs)*.8);font-weight:500;color:oklch(.86 .09 var(--hue))}
.hud .graph{display:flex;align-items:flex-end;gap:1px;height:calc(var(--u)*4.5);margin:calc(var(--u)*1) 0}
.hud .graph i{flex:1;background:var(--accent-a55);display:block}
.hud .graph i.sp{background:oklch(.72 .17 55 / .85)}
.hud .r3{font-size:calc(var(--fs)*.66);color:rgba(255,255,255,.55);display:flex;gap:calc(var(--u)*2.5)}

/* audio meters in a well */
.meters{padding:calc(var(--u)*3)}
.mrow{display:flex;align-items:center;gap:calc(var(--u)*2);margin-bottom:calc(var(--u)*1)}
.mrow span{font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.66);color:var(--t-meta);width:calc(var(--u)*3)}
.mrow .segs{display:flex;gap:2px;flex:1}
.mrow .segs i{flex:1;height:calc(var(--u)*1.5);background:rgba(255,255,255,.09);display:block}
.mrow .segs i.lit{background:oklch(.74 .12 var(--hue) / .85)}

/* ---------- GROUP heading + ROW (the whole taxonomy) ---------------------- */
.group{display:flex;align-items:center;gap:calc(var(--u)*2.5);
  margin:calc(var(--u)*6) 0 calc(var(--u)*1);
  font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.68);font-weight:500;
  text-transform:uppercase;color:var(--t-meta)}
.group::after{content:"";flex:1;height:1px;background:var(--hair)}
.group:first-child{margin-top:calc(var(--u)*4)}

.row{
  position:relative;display:flex;align-items:center;gap:calc(var(--u)*3);
  min-height:var(--row-h);padding:calc(var(--u)*1.5) calc(var(--u)*3);
  margin-left:calc(var(--u)*-3);margin-right:calc(var(--u)*-3);
  border-bottom:1px solid rgba(255,255,255,.045);
  cursor:pointer;
}
.row:hover{background:rgba(255,255,255,.035)}
.row.foc{background:var(--e2)}
.row.foc::before{content:"";position:absolute;left:0;top:calc(var(--u)*1);bottom:calc(var(--u)*1);
  width:calc(var(--u)*.75);background:var(--accent);box-shadow:0 0 calc(var(--u)*3) var(--accent-a55)}
.row.dis{opacity:.38;cursor:default}
.row .txt{min-width:0;flex:1}
.row .lbl{font-size:var(--fs);color:var(--t-label);line-height:1.25}
.row.foc .lbl{color:var(--t-primary)}
.row .help{font-size:calc(var(--fs)*.8);color:var(--t-meta);margin-top:calc(var(--u)*.5);line-height:1.3}
.row .ctl{width:var(--ctl-w);flex:none;display:flex;justify-content:flex-end;align-items:center;gap:calc(var(--u)*2)}
.row.wide-ctl .ctl{width:calc(var(--u)*76)}

/* control: switch */
.sw{width:calc(var(--u)*11);height:calc(var(--u)*6);flex:none;position:relative;
  background:rgba(255,255,255,.07);border:1px solid var(--hair-strong)}
.sw i{position:absolute;top:calc(var(--u)*.75);left:calc(var(--u)*.75);
  width:calc(var(--u)*4);height:calc(var(--u)*4);background:rgba(239,245,251,.55);display:block;
  transition:left .12s ease-out}
.sw.on{background:var(--accent-a30);border-color:var(--accent-a55)}
.sw.on i{left:calc(var(--u)*5.75);background:var(--accent-knob)}

/* control: segmented */
.seg{display:flex;gap:calc(var(--u)*.75)}
.seg b{font-family:'Geist Mono',monospace;font-weight:500;font-size:calc(var(--fs)*.76);
  padding:calc(var(--u)*1.25) calc(var(--u)*2);background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);color:rgba(239,245,251,.5)}
.seg b.on{background:var(--accent-a30);border-color:var(--accent-a55);color:var(--accent-seg);font-weight:600}

/* control: picker (opens a sheet) */
.pick{display:flex;align-items:center;gap:calc(var(--u)*2);
  font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.9);color:var(--accent-value);
  padding:calc(var(--u)*1.25) calc(var(--u)*2);background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08)}
.pick s{text-decoration:none;color:var(--t-disabled)}

/* control: slider (compact — lives inside the control column) */
.sl{display:flex;align-items:center;gap:calc(var(--u)*2.5);width:100%}
.sl .track{position:relative;flex:1;height:calc(var(--u)*1.5);background:rgba(255,255,255,.16)}
.sl .fill{position:absolute;left:0;top:0;bottom:0;
  background:linear-gradient(90deg, oklch(.74 .12 var(--hue) / .5), oklch(.78 .12 var(--hue)))}
.sl .knob{position:absolute;top:calc(var(--u)*-1.75);width:calc(var(--u)*2.5);height:calc(var(--u)*5);
  background:oklch(.90 .05 var(--hue));transform:translateX(-50%);
  box-shadow:0 0 calc(var(--u)*3) var(--accent-a55)}
.sl .v{font-family:'Geist Mono',monospace;font-weight:500;font-size:calc(var(--fs)*.9);
  color:var(--accent-value);min-width:calc(var(--u)*17);text-align:right}
.row.dis .sl .fill{background:rgba(255,255,255,.3)}
.row.dis .sl .knob{background:rgba(255,255,255,.45);box-shadow:none}
.row.dis .sl .v{color:var(--t-meta)}

/* control: readout / value / drill / action / colour */
.ro{font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.86);color:var(--t-meta);
  text-align:right}
.ro.acc{color:var(--accent-value)}
.dot{width:calc(var(--u)*1.5);height:calc(var(--u)*1.5);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 calc(var(--u)*2) oklch(.78 .16 145 / .5)}
.dot.warn{background:var(--warn)}
.dot.idle{background:rgba(239,245,251,.35)}
.chev{color:var(--t-disabled);font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.9)}
.act{font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.82);text-transform:uppercase;
  color:var(--accent-text);border:1px solid var(--accent-a30);
  padding:calc(var(--u)*1.25) calc(var(--u)*2.5);background:var(--accent-a08)}
.act.danger{color:var(--danger);border-color:oklch(.70 .17 25 / .35);background:oklch(.70 .17 25 / .08)}
.swatch{width:calc(var(--u)*7);height:calc(var(--u)*5);border:1px solid rgba(255,255,255,.2)}
.chip{font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.68);text-transform:uppercase;
  padding:calc(var(--u)*.75) calc(var(--u)*1.5);background:var(--accent-a18);color:var(--accent-text)}
.chip.n{background:rgba(255,255,255,.06);color:var(--t-meta)}
.tin{font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.88);color:var(--t-primary);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
  padding:calc(var(--u)*1.25) calc(var(--u)*2);width:100%;text-align:right}

/* ---------- LOG (Wide stage) ---------------------------------------------- */
.logbar{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*3) var(--pad-x);
  border-bottom:1px solid var(--hair);background:var(--e1)}
.logbar .find{flex:1;display:flex;align-items:center;gap:calc(var(--u)*2);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
  padding:calc(var(--u)*1.25) calc(var(--u)*2.5);font-family:'Geist Mono',monospace;
  font-size:calc(var(--fs)*.84);color:var(--t-primary)}
.logbar .find s{text-decoration:none;color:var(--t-disabled)}
.logview{flex:1;min-height:0;overflow:auto;padding:calc(var(--u)*2) var(--pad-x) calc(var(--u)*4);
  font-family:'Geist Mono',monospace;font-size:calc(var(--fs)*.82);line-height:1.55}

<script>
/* ==========================================================================
   The mock's own "kit" — deliberately shaped like the C++ helper API in
   API.md, so the call sites below read like the real ones will.
   Every row is produced by exactly one call. Nothing here takes a position,
   a width, a font or a colour.
   ========================================================================== */
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let OUT = [];
const K = {
  group(t){ OUT.push(`<div class="group">${esc(t)}</div>`); },

  _row(ctl, label, o={}){
    const cls = ['row', o.focus?'foc':'', o.disabled?'dis':'', o.wide?'wide-ctl':''].join(' ');
    const help = (o.disabled && o.why) ? o.why : o.help;
    OUT.push(
      `<div class="${cls}">
         <div class="txt"><div class="lbl">${esc(label)}</div>${
           help?`<div class="help">${esc(help)}</div>`:''}</div>
         <div class="ctl">${ctl}</div>
       </div>`);
  },

  switch(l, v, o){ K._row(`<div class="sw ${v?'on':''}"><i></i></div>`, l, o); },

  slider(l, v, lo, hi, o={}){
    const p = Math.max(0, Math.min(1, (v-lo)/(hi-lo)))*100;
    K._row(
      `<div class="sl">
         <div class="track"><div class="fill" style="width:${p}%"></div>
           <div class="knob" style="left:${p}%"></div></div>
         <div class="v">${esc(o.fmt||v)}</div>
       </div>`, l, o);
  },

  /* one call. The kit measures the options and picks segmented vs picker. */
  choice(l, cur, opts, o={}){
    const fits = opts.length <= 5 && opts.join('').length <= 26;
    const ctl = fits
      ? `<div class="seg">${opts.map(x=>`<b class="${x===cur?'on':''}">${esc(x)}</b>`).join('')}</div>`
      : `<div class="pick">${esc(cur)} <s>›</s></div>`;
    K._row(ctl, l, Object.assign({wide:fits&&opts.length>=5}, o));
  },

  drill(l, summary, o={}){
    K._row(`<span class="ro">${esc(summary)}</span><span class="chev">›</span>`, l, o);
  },
  readout(l, v, o={}){
    const d = o.status ? `<span class="dot ${o.status}"></span>` : '';
    K._row(`${d}<span class="ro ${o.accent?'acc':''}">${esc(v)}</span>`, l, o);
  },
  action(l, verb, o={}){
    K._row(`<span class="act ${o.danger?'danger':''}">${esc(verb)}</span>`, l, o);
  },
  color(l, css, o={}){
    K._row(`<span class="ro">${esc(o.hex||'')}</span><span class="swatch" style="background:${css}"></span><span class="chev">›</span>`, l, o);
  },
  text(l, v, o={}){
    K._row(`<span class="tin">${esc(v)}</span>`, l, Object.assign({wide:true}, o));
  },
  chips(l, items, o={}){
    K._row(items.map(c=>`<span class="chip ${c[1]?'':'n'}">${esc(c[0])}</span>`).join(''), l, o);
  }
};

/* --- Gamescope › Upscaling ------------------------------------------------ */
function scrGamescopeUpscaling(){
  K.group('Scaling');
  K.choice('Filter','fsr',['linear','nearest','fsr','nis','pixel'],{focus:true});
  K.choice('Scaler','auto',['auto','integer','fit','fill','stretch'],
           {help:'How the game image is placed inside the output.'});
  K.slider('Sharpness', 40, 0, 100, {fmt:'40 % sharper', help:'FSR and NIS only — ignored by the other filters.'});
  K.readout('Effective resolution','1280×960 → 1920×1080',{status:'ok'});

  K.group('Pre-upscale');
  K.drill('Pre-Sharpen','on · 0.50',{help:'Runs before the scaler — works with any Filter.'});
  K.drill('Vibrancy','on · +0.42');

  K.group('Presentation');
  K.switch('VRR / Adaptive Sync', true, {help:'Needs a display and a game that both support it.'});
  K.switch('Allow Tearing', false, {disabled:true, why:'Unavailable while VRR / Adaptive Sync is on.'});
  K.switch('Force Grab Cursor', false);
  K.action('Reset this screen','Reset');
}

const STATE = {sec:'gamescope', tab:0, focusRail:false};

const SCREENS = {
  'gamescope:0': {draw:scrGamescopeUpscaling},
  'gamescope:3': {draw:scrGamescopeHdr},
  'monitor:0':   {draw:scrMonitorGeneral, well:wellMonitor},
  'audio:0':     {draw:scrAudio, well:wellAudio},
  'config:1':    {draw:scrConfigGeneral}
};

function sec(){ return SECTIONS.find(s=>s.id===STATE.sec); }

function renderRail(){
  const el = document.getElementById('rail');
  let h = '<div class="rgroup">Console</div>';
  SECTIONS.forEach(s=>{
    const sel = s.id===STATE.sec;
    h += `<div class="ri ${sel&&!STATE.focusRail?'sel':''} ${sel&&STATE.focusRail?'foc':''}" data-sec="${s.id}">
            <span class="gl"><svg viewBox="0 0 20 20">${ICON[s.icon]}</svg></span>
            <span class="lbl">${s.title}</span>
            ${s.count?`<span class="cnt">${s.count}</span>`:''}
          </div>`;
  });
  h += `<div class="grow"></div><div class="foot">gamescope-ritz · 3.16.14</div>`;
  el.innerHTML = h;
  el.querySelectorAll('.ri').forEach(n=>n.onclick=()=>{STATE.sec=n.dataset.sec;STATE.tab=0;STATE.focusRail=false;render();});
}

function renderStage(){
  const s = sec();
  const stage = document.getElementById('stage');
  document.getElementById('body').classList.toggle('wide', s.stage==='wide');

  if (s.id==='log'){ stage.innerHTML = stageLog(); renderLegend(); return; }

  const key = s.id+':'+STATE.tab;
  const scr = SCREENS[key];
  let h = `<div class="subtabs">${s.subtabs.map((t,i)=>
      `<button class="${i===STATE.tab?'on':''}" data-tab="${i}">${t}</button>`).join('')}
      <div class="rt">LB / RB · section &nbsp; LT / RT · tab</div></div>`;

  if (scr && scr.well) h += scr.well();

  OUT = [];
  if (scr) scr.draw();
  else {
    K.group(s.subtabs[STATE.tab]);
    K.readout('Not drawn in this mock','see Upscaling · HDR · General · Log');
  }
  h += `<div class="scroll">${OUT.join('')}</div>`;
  stage.innerHTML = h;
  stage.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{STATE.tab=+b.dataset.tab;render();});
  stage.querySelectorAll('.pcell').forEach((c,i)=>c.onclick=()=>{
    stage.querySelectorAll('.pcell').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel');
    const hud = stage.querySelector('.hud');
    const r = Math.floor(i/3), col = i%3, m = 'calc(var(--u)*5)';
    hud.style.top = r===0?m:(r===1?'50%':'auto');
    hud.style.bottom = r===2?m:'auto';
    hud.style.left = col===0?m:(col===1?'50%':'auto');
    hud.style.right = col===2?m:'auto';
    hud.style.transform = `translate(${col===1?'-50%':'0'}, ${r===1?'-50%':'0'})`;
  });
  renderLegend();
}

function renderCrumb(){
  const s = sec();
  const parts = [`<span class="up">Console</span>`,`<span class="sep">›</span>`,
                 `<span class="up">${s.title}</span>`];
  if (!s.stage) { parts.push(`<span class="sep">›</span>`, `<span>${s.subtabs[STATE.tab]}</span>`); }
  else parts.push(`<span class="sep">›</span>`,`<span>${s.subtabs[0]}</span>`);
  document.getElementById('crumb').innerHTML = parts.join('');
  document.getElementById('pips').innerHTML =
    `<i class="on"></i><i class="on"></i><i></i>`;
  document.getElementById('badge').textContent =
    (STATE.sec==='config' && STATE.tab===1) ? 'global' : 'app 1245620';
}

function renderLegend(){
  const s = sec();
  const rows = s.id==='log'
    ? [['A','Follow',1],['X','Copy'],['Y','Clear'],['/','Find'],['B','Back']]
    : [['A','Adjust',1],['B','Back'],['Y','Reset to default'],['X','Save profile'],['/','Find a setting']];
  document.getElementById('legend').innerHTML =
    rows.map(r=>`<span class="k ${r[2]?'acc':''}"><b>${r[0]}</b>${r[1]}</span>`).join('') +
    `<span class="sp"></span><span class="hint">CTRL+SHIFT+O closes · game input paused</span>`;
}

function render(){ renderRail(); renderStage(); renderCrumb(); }
render();

/* ---- sheet -------------------------------------------------------------- */
const SHEET_OPTS = [
  ['auto','Integer scale when it fits exactly, otherwise fit.'],
  ['integer','Whole-number multiples only. Pillarboxes the rest.'],
  ['fit','Largest size that keeps the aspect ratio.'],
  ['fill','Fills the output; crops the long edge.'],
  ['stretch','Ignores aspect ratio. Fills exactly.']
];
document.getElementById('sheetbody').innerHTML = SHEET_OPTS.map(o=>
  `<div class="opt ${o[0]==='auto'?'sel':''}">
     <div><div class="on">${o[0]}</div><div class="od">${o[1]}</div></div>
     ${o[0]==='auto'?'<span class="mk">●</span>':''}
   </div>`).join('');
const sw = document.getElementById('sheetwrap');
document.getElementById('sheetbtn').onclick = e => {
  sw.classList.toggle('on'); e.target.classList.toggle('on', sw.classList.contains('on'));
};
sw.querySelector('.scr').onclick = () => {
  sw.classList.remove('on'); document.getElementById('sheetbtn').classList.remove('on');
};

/* ---- demo controls ------------------------------------------------------ */
document.querySelectorAll('#demo [data-scale]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#demo [data-scale]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const k = parseFloat(b.dataset.scale);
  document.documentElement.style.setProperty('--u', (4*k)+'px');
  document.documentElement.style.setProperty('--fs',(15*k)+'px');
});
const hue = document.getElementById('hue');
hue.oninput = () => {
  document.documentElement.style.setProperty('--hue', hue.value);
  document.getElementById('huev').textContent = hue.value;
};
let g = 0;
document.getElementById('bg').onclick = () => {
  g = (g+1)%3;
  document.getElementById('game').className = 'g'+g;
  const p = document.querySelector('.preview'); if (p) p.className = 'preview g'+g;
};

/* ---- keyboard: the real nav model, demonstrated ------------------------- */
document.addEventListener('keydown', e=>{
  const i = SECTIONS.findIndex(s=>s.id===STATE.sec);
  if (e.key==='Tab'){ e.preventDefault();
    STATE.sec = SECTIONS[(i + (e.shiftKey?-1:1) + SECTIONS.length)%SECTIONS.length].id;
    STATE.tab = 0; render(); }
  if (e.key==='ArrowRight'){ const s=sec(); STATE.tab=Math.min(s.subtabs.length-1,STATE.tab+1); render(); }
  if (e.key==='ArrowLeft'){ STATE.tab=Math.max(0,STATE.tab-1); render(); }
  if (e.key==='Escape'){ sw.classList.remove('on'); }
});
</script>
